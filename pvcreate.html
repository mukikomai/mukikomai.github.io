<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無季 氷下魚 | PV Create</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="bg-glow"></div>
<div id="grid"></div>
<div id="cracks">
  <svg viewBox="0 0 800 1200" preserveAspectRatio="none">
    <path d="M0 120 L180 160 L260 90 L420 140 L520 60"/>
    <path d="M0 640 L140 610 L230 690 L380 650 L500 720 L650 660"/>
    <path d="M800 300 L640 340 L560 260 L440 310"/>
  </svg>
</div>

<header id="site-nav">
  <img class="nav-logo" src="images/無季 氷下魚.png" alt="無季 氷下魚 ロゴ">
  <nav class="nav-links">
    <a href="index.html">HOME</a>
    <a href="profile.html">Profile</a>
    <a href="pvcreate.html" class="active">PV Create</a>
    <a href="fa.html">FA</a>
  </nav>
</header>

<section class="wrap page-head reveal">
  <h1>PV Create</h1>
  <p class="page-description">
    制作したPVや動画作品を紹介します。
  </p>
</section>

<section id="pv-gallery">
  <div class="wrap reveal">
    <h2><span class="no">01</span>Works</h2>

    <div class="pv-grid">
      <!-- サンプル作品 -->
      <article class="pv-card">
        <div class="pv-video">
          <video
            controls
            controlsList="nodownload"
            oncontextmenu="return false"
            preload="metadata"
            playsinline
            poster="images/pv/sample-poster.jpg"
          >
            <source src="videos/sample.mp4" type="video/mp4">
            お使いのブラウザは動画再生に対応していません。
          </video>
        </div>

        <div class="pv-info">
          <span class="pv-category">PV / SAMPLE</span>
          <h3>Sample Movie</h3>
          <p>
            適当に作ったサンプルです。
            フリーイラストで文字を入れただけの簡単なPVです。
          </p>
        </div>
      </article>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">© 2026 無季 氷下魚</div>
</footer>

<script src="js/main.js" defer></script>
</body>
</html>
