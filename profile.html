<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>無季 氷下魚 | Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .profile-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 24px 120px;
    }

    .profile-main {
      width: 100%;
      z-index: 2;
    }

    /* 名前 + 顔アップを同じボックスにする */
    .profile-visual {
      position: relative;
      height: 100px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      backdrop-filter: blur(10px);
    }

    /* 顔のドアップ */
    .profile-visual::before {
      z-index: 0;
      content: '';
      height: 420px;
      width: 800px;
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg,
          rgba(5, 8, 16, .94) 30%,
          rgba(5, 8, 16, .78) 50%,
          rgba(5, 8, 16, .35) 70%,
          rgba(5, 8, 16, .08) 98%,
          rgba(5, 8, 16, .0) 100%),
        var(--profile-face);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 1;
    }

    /* 名前 */
    .profile-name {
      position: absolute;
      z-index: 2;
      left: 2%;
      bottom: 20%;
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(3rem, 8vw, 3.8rem);
      font-weight: 700;
      line-height: .95;
      letter-spacing: -.035em;
      color: #F4FBFF;
      text-shadow: 0 12px 30px rgba(0, 0, 0, .5);
    }

    /* 画像の下に敷く暗い膜 */
    .profile-visual::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(0deg,
          rgba(5, 8, 16, .48) 0%,
          transparent 55%);
    }
  </style>
</head>

<body>
  <div id="bg-glow"></div>
  <div id="grid"></div>
  <div id="cracks">
    <svg viewBox="0 0 800 1200" preserveAspectRatio="none">
      <path d="M0 120 L180 160 L260 90 L420 140 L520 60" />
      <path d="M0 640 L140 610 L230 690 L380 650 L500 720 L650 660" />
      <path d="M800 300 L640 340 L560 260 L440 310" />
    </svg>
  </div>

  <header id="site-nav">
    <img class="nav-logo" src="images/無季 氷下魚.png" alt="無季 氷下魚 ロゴ">
    <nav class="nav-links">
      <a href="index.html" class="active">HOME</a>
      <a href="profile.html">Profile</a>
      <a href="pvcreate.html">PV Create</a>
      <a href="fa.html">FA</a>
    </nav>
  </header>


  <main class="profile-page">

    <section class="profile-hero">

      <!-- 左：ふよふよ上下する人物画像 -->
      <div class="profile-character-wrap">

        <div class="wrap reveal">
          <img class="profile-character" src="images/illustration.png" alt="プロフィール画像">
        </div>
      </div>

      <!-- 右 -->
      <div class="profile-main">

        <!-- 名前 + 顔ドアップを同じボックス -->
        <!-- 顔画像は style の --profile-face で指定 -->

        <div class="profile-visual" style="--profile-face:url('images/Vpro.png');">
          <h1 class="profile-name">無季 氷下魚</h1>
        </div>

        <!-- 2列×2行 -->
        <div class="wrap reveal">
          <div class="profile-data">

            <div class="profile-data-grid">

              <div class="profile-data-item">
                <span class="profile-label">配信時間</span>
                <span class="profile-value">20:00 ～ 24:00</span>
              </div>

              <div class="profile-data-item">
                <span class="profile-label">プラットフォーム</span>
                <span class="profile-value">
                  <a href="https://www.youtube.com/@mukikomai_t" target="_blank" rel="noopener">YouTube</a><a> / </a>
                  <a href="https://twitch.tv/mukikomai_t" target="_blank" rel="noopener">Twitch</a><a> / </a>
                  <a href="https://twitcasting.tv/g:111551519392213336703" target="_blank" rel="noopener">Twitch</a>
                </span>
              </div>

              <div class="profile-data-item">
                <span class="profile-label">誕生日</span>
                <span class="profile-value">10月17日</span>
              </div>

              <div class="profile-data-item">
                <span class="profile-label">ファンアート</span>
                <span class="profile-value">#イラこまいの</span>
              </div>
            </div>

          </div>
        </div>

        <!-- 棒 -->
        <div class="wrap reveal">
          <div class="description-divider"></div>
        </div>

        <!-- DESCRIPTION -->
        <div class="wrap reveal">
          <section class="description-box">
            <h2 class="description-title">DESCRIPTION</h2>

            <p class="description-text">
              主にMinecraftを中心にいろんなゲーム配信や雑談配信で活動してます！
              見に来てくれるととっても嬉しいです\(❘ω❘\)！
            </p>
          </section>
        </div>
      </div>
    </section>

  </main>

  <footer>
    <div class="wrap">© 2026 無季 氷下魚</div>
  </footer>

  <script src="js/main.js" defer></script>
</body>

</html>
